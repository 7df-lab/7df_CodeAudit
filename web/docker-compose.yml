version: '3.8'

# CodeAudit Console — 前端容器（静态托管 + /v1 反代网关）
# 用法:
#   docker compose up -d                      # 网关在宿主机 8080（默认）
#   CODEAUDIT_GATEWAY_UPSTREAM=gateway.internal:8080 docker compose up -d
#   docker compose logs -f console
services:
  console:
    build: .
    image: codeaudit-console:latest
    container_name: codeaudit-console
    ports:
      - "${CODEAUDIT_CONSOLE_PORT:-8088}:80"
    environment:
      # 浏览器可见流量全部经本容器 /v1 反代；此处只需网关的"容器可达"地址
      CODEAUDIT_GATEWAY_UPSTREAM: ${CODEAUDIT_GATEWAY_UPSTREAM:-host.docker.internal:8080}
    # Linux 无内建 host.docker.internal，显式映射到宿主网关（Docker Desktop 上冗余无害）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# 默认网显式命名：网络名 ↔ 部署项目一眼可辨（伞仓部署链统一 codeaudit- 前缀）
networks:
  default:
    name: codeaudit-web-net
