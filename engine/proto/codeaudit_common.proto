// ------------------------------------------------------------
// UserService（project-service 部署）——用户子域
// V1.0 不含 MFA（MFA 接口已在最终审查中删除）
// V2.1 (ADR-205): 8→13 RPC，新增用户生命周期五接口
// ------------------------------------------------------------
service UserService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc ValidatePermission(ValidatePermissionRequest) returns (ValidatePermissionResponse);
  rpc GetUserPermissions(GetUserPermissionsRequest) returns (UserPermissions);
  // V2.1 (ADR-205)：自助注册/管理列表/管理员建号/自助改密/管理员重置
  rpc RegisterUser(RegisterUserRequest) returns (LoginResponse);  // 幂等；注册即登录（默认邀请码制，configs auth.registration_mode）
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);    // 管理端（网关 admin 门禁）
  rpc CreateUser(CreateUserRequest) returns (User);               // 幂等；管理员直建，must_change_password 置真（一次性临时密码语义）
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty);  // 幂等；自助改密，成功即清除 must_change_password
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);    // 幂等；管理员重置为服务端生成的临时密码
  // V2.2 邀请码管理（ADR-255；静态配置码=bootstrap 层合并校验，不入库不管理）
  rpc CreateInviteCode(CreateInviteCodeRequest) returns (InviteCode);         // 幂等；admin 生成（系统随机码，管理员只填备注）
  rpc ListInviteCodes(ListInviteCodesRequest) returns (ListInviteCodesResponse); // 管理端（网关 admin 门禁；config 注入码只读随行）
  rpc RevokeInviteCode(RevokeInviteCodeRequest) returns (InviteCode);         // 幂等；状态翻转非删除（活跃码唯一下线通道）
  rpc DeleteInviteCode(DeleteInviteCodeRequest) returns (google.protobuf.Empty); // 幂等；仅终态码（已吊销/已用尽/已过期），硬删无审计残迹
  rpc GetRegistrationPolicy(GetRegistrationPolicyRequest) returns (GetRegistrationPolicyResponse); // 注册策略只读（网关 /v1/auth 公开面；仅 mode 不含码表）
}

// ------------------------------------------------------------
// ResultService（result-service 部署）——审计结果域
// ------------------------------------------------------------
service ResultService {
  rpc CreateFinding(CreateFindingRequest) returns (AuditFinding);
  rpc GetFinding(GetFindingRequest) returns (AuditFinding);
  rpc UpdateFinding(UpdateFindingRequest) returns (AuditFinding);
  rpc DeleteFinding(DeleteFindingRequest) returns (google.protobuf.Empty);
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);
  rpc BatchCreateFindings(BatchCreateFindingsRequest) returns (BatchCreateFindingsResponse);  // 幂等
  rpc BatchUpdateFindings(BatchUpdateFindingsRequest) returns (BatchUpdateFindingsResponse);  // 幂等
  rpc BatchUpdateVerdict(BatchUpdateVerdictRequest) returns (BatchUpdateVerdictResponse);
  rpc UpdateVerdict(UpdateVerdictRequest) returns (AuditFinding);
  rpc GetFindingsByVerdict(GetFindingsByVerdictRequest) returns (ListFindingsResponse);
  rpc GetTaskResultStats(GetTaskResultStatsRequest) returns (ResultStats);
  rpc ExportFindings(ExportFindingsRequest) returns (ExportFindingsResponse);

  // 误报反馈闭环（评审整合项）
  rpc SubmitFindingFeedback(SubmitFindingFeedbackRequest) returns (SubmitFindingFeedbackResponse);

  // 增量扫描继承（ADR-225）：复制基线任务中"未变更文件"的 findings 到新任务
  //（写路径物化，连带 verdict/AI 建议终态；变更∪删除文件的旧 findings 不继承）
  rpc InheritFindings(InheritFindingsRequest) returns (InheritFindingsResponse);  // 幂等
}

// ------------------------------------------------------------
// ReportService（result-service 部署）——报告生成子域
// 统一经 Kafka task.completed 触发；gRPC 直调 GenerateReport 仅作降级路径（幂等）
// ------------------------------------------------------------
service ReportService {
  rpc GenerateReport(GenerateReportRequest) returns (GenerateReportResponse);  // 幂等
  rpc GetReport(GetReportRequest) returns (Report);
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc GetTemplate(GetTemplateRequest) returns (ReportTemplate);
  rpc DownloadReport(DownloadReportRequest) returns (stream ReportChunk);
}

// ------------------------------------------------------------
// RuntimeService（runtime-service 部署）——Agent编排
// 定版 12 RPC（V1.x 工作流文档的 3 RPC 版作废；ADR-168 += GetAIInteractionLog）
// RunAIAnalysis / ReviewSASTResults 必须携带幂等键（R6）
// ------------------------------------------------------------
service RuntimeService {
  // 分析主接口（模式A/B/C）
  rpc RunAIAnalysis(RunAIAnalysisRequest) returns (RunAIAnalysisResponse);                  // 模式B/C
  rpc VerifySASTResults(VerifySASTResultsRequest) returns (VerifySASTResultsResponse);  // 模式D AI增强SAST 阶段3（ADR-186 复用原4a；含同段去重）
  rpc SearchMissedVulns(SearchMissedVulnsRequest) returns (SearchMissedVulnsResponse);  // 【已弃用 ADR-182】原4b，仅历史模式兼容
  rpc ReviewSASTResults(ReviewSASTResultsRequest) returns (ReviewSASTResultsResponse);  // 【已弃用 ADR-182】旧模式D，仅历史模式兼容

  // 进度与会话
  rpc GetAnalysisProgress(GetAnalysisProgressRequest) returns (AnalysisProgress);
  rpc WatchAnalysisProgress(WatchAnalysisProgressRequest) returns (stream AnalysisProgressEvent);
  rpc GetSessionStatus(GetSessionStatusRequest) returns (SessionStatus);
  rpc CancelAnalysis(CancelAnalysisRequest) returns (google.protobuf.Empty);
  rpc PauseAnalysis(PauseAnalysisRequest) returns (google.protobuf.Empty);   // ADR-200: 会话回合闸门挂起（当前回合跑完生效）
  rpc ResumeAnalysis(ResumeAnalysisRequest) returns (google.protobuf.Empty); // ADR-200: 释放闸门继续后续回合
  // AI 交互日志（ADR-168）：沙箱内 DSH bridge SSE 交互的原始留存，游标增量读取
  rpc GetAIInteractionLog(GetAIInteractionLogRequest) returns (GetAIInteractionLogResponse);
  // ADR-189 交互日志订阅流：人性化流写入即推增量（字节游标语义与 GetAIInteractionLog
  // 一致；complete=true 终帧后服务端关流）
  rpc StreamAIInteractionLog(StreamAIInteractionLogRequest) returns (stream GetAIInteractionLogResponse);

  // 推理 provider/路由管理（ADR-217：经 openshell-manager 透传 OpenShell 网关，权威
  // 存储在网关 gateway.db；本服务只做管道。workspace 请求级可选（ADR-247 切片3后半：
  // per-team 命名空间配置入口），空=runtime.sandbox.workspace 全局缺省；
  // credentials 只进不出——透传 manager→网关加密存储，任何响应不回流）
  rpc ListInferenceProviders(ListInferenceProvidersRequest) returns (ListInferenceProvidersResponse);
  rpc GetInferenceProvider(GetInferenceProviderRequest) returns (InferenceProviderInfo);
  rpc UpsertInferenceProvider(UpsertInferenceProviderRequest) returns (UpsertInferenceProviderResponse);
  rpc DeleteInferenceProvider(DeleteInferenceProviderRequest) returns (DeleteInferenceProviderResponse);
  rpc GetInferenceRoute(GetInferenceRouteRequest) returns (InferenceRouteInfo);
  rpc SetInferenceRoute(SetInferenceRouteRequest) returns (SetInferenceRouteResponse);
  // workspace 生命周期清单（切片3b team 上车：web Provider 页工作区选择器的数据源；
  // 只读透传 manager→网关 gRPC ListWorkspaces；建/删区走 manager 运营面不进本面）
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  // Agent 清单端点（TP20-T2 切换 Agent 收口）：descriptor 注册表如实投影（首条=缺省）。
  // 消费面=web 创建页+切换 Modal 同源（经 gateway GET /v1/agents 转发）；不做可用性
  // 探测——清单=静态注册表，运行期装配校验（LoadDescriptor）兜底。
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // 工作区生命周期写面（web 管理页通道，2026-09-19 人类指令扩面）：
  // 建区（重名 409/名字非法 400 语义经 manager 透传）；删区（空区才可删，
  // 资源守卫 409 details 原文透出）
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (WorkspaceInfo);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);
  // 图执行模式（平台切片 5+6，ADR-249）：pack 声明 execution:graph 的任务走
  // GraphRunner 串行图——节点=同沙箱独立 session，graph.* 域中立事件族落
  // <task>.graph.log。必须携带幂等键（R6）。
  rpc RunGraphTask(RunGraphTaskRequest) returns (RunGraphTaskResponse);
  // v0.5（graph-engine-v0.5-blackboard-hoc.md §4/§2.1）：人机共编辑注入与节点重开。
  // 注入=对沙箱内 Agent 追加特定消息（bridge 排队→回合边界生效，不打断当回合）。
  rpc InjectGraphNodeMessage(InjectGraphNodeMessageRequest) returns (InjectGraphNodeMessageResponse);
  rpc ReopenGraphNode(ReopenGraphNodeRequest) returns (ReopenGraphNodeResponse);
  // v0.5 认领层 REST 面（§2.1/§5.1 Claim 按钮）：human 认领占住节点（引擎调度
  // 跳过）/释放回 open。holder=human；ttl 秒（0=缺省 30m）。
  rpc ClaimGraphNode(ClaimGraphNodeRequest) returns (ClaimGraphNodeResponse);
  rpc ReleaseGraphNode(ReleaseGraphNodeRequest) returns (ReleaseGraphNodeResponse);
}

