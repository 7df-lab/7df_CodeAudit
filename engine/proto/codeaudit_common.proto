message RunGraphTaskRequest {
  RequestMetadata metadata = 1;   // 幂等键（必须）
  string task_id = 2;
  string project_path = 3;        // 空=不上传项目（渗透任务目标=授权目标非代码树）
  TaskOrigin task_origin = 4;     // 网络分型/授权目标/workspace 贯穿（ADR-247/248）
  string goal = 5;                // 任务目标一句话（节点 prompt 有界投影的 goal 面，A4）
  GraphSpec graph = 6;            // 图配置快照（pack spec.graph 创建时钉）
  optional string agent = 7;      // TP20 缺损批 B11：任务级 Agent（空=部署缺省）——图路径
                                  // 此前不消费任务级 agent（a4a271c 注记），切换 Agent 对图任务
                                  // 静默不生效；接线后 PAUSED 图任务换笔→resume 节点按新 agent 起沙箱
}
// RunGraphTaskResponse — 图收敛/挂起结果。findings 由 executor 节点经既有
// submit_findings 通道提交、随 mapSandboxFindings 落 result-service（4b 同构），
// 不在本响应重复承载（响应只报图自身状态——域中立 C4）。
