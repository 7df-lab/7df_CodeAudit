message GetToolInfoRequest { string tool_id = 1; }
message SASTToolInfo { string tool_id = 1; string name = 2; repeated string supported_languages = 3; string output_format = 4; }
message ValidateToolConfigRequest { string tool_id = 1; map<string, string> tool_config = 2; }
message ValidateToolConfigResponse { bool valid = 1; repeated string errors = 2; }
message GetScanProgressRequest { string task_id = 1; string tool_id = 2; }
message ScanProgress { string task_id = 1; string tool_id = 2; float percent = 3; ScanStatus status = 4; }

message FuseResultsRequest {
  RequestMetadata metadata = 1;   // 幂等键
  string task_id = 2;
  repeated string sast_finding_ids = 3;
  repeated string ai_finding_ids = 4;
}
message FuseResultsResponse { FusionResult result = 1; }
message AlignLocationsRequest { repeated string finding_ids = 1; }
message AlignLocationsResponse { repeated MergeGroup aligned_groups = 1; }
message ClusterFindingsRequest { repeated string finding_ids = 1; float similarity_threshold = 2; }
message ClusterFindingsResponse { repeated MergeGroup clusters = 1; }
message ResolveConflictsRequest { repeated string finding_ids = 1; }
message ResolveConflictsResponse { repeated ConflictItem resolved = 1; }
message FusionConfig { map<string, string> config = 1; }
message GetFusionConfigRequest {}
message UpdateFusionConfigRequest { FusionConfig config = 1; }
message CompareResultsRequest { string task_id = 1; repeated string sast_finding_ids = 2; repeated string ai_finding_ids = 3; }
message CompareResultsResponse { ComparisonSummary summary = 1; }
message CalculateMetricsRequest { string task_id = 1; }
message GenerateComparisonReportRequest { string task_id = 1; ReportFormat format = 2; }
message ComparisonReport { string report_id = 1; ComparisonSummary summary = 2; string venn_data_url = 3; }

// --- StorageService / NotificationService 骨架 ---
message UploadFileChunk { bytes data = 1; string file_path = 2; string content_type = 3; bool first_chunk = 4; }
message DownloadFileRequest { string file_id = 1; }
message DownloadFileChunk { bytes data = 1; }
message GetPresignedUrlRequest { string file_path = 1; enum UrlOp { URL_OP_UNSPECIFIED = 0; URL_OP_UPLOAD = 1; URL_OP_DOWNLOAD = 2; } UrlOp operation = 2; int64 ttl_seconds = 3; }
message GetPresignedUrlResponse { string url = 1; google.protobuf.Timestamp expires_at = 2; }
message GetFileInfoRequest { string file_id = 1; }
// ADR-225: 存储档位探测（只读；无幂等键要求——读 RPC）
message GetStorageModeRequest {}
message GetStorageModeResponse { string mode = 1; }  // "s3" | "memory"
message DeleteFileRequest { string file_id = 1; }
message ListFilesRequest { string prefix = 1; PaginationRequest pagination = 2; }
message ListFilesResponse { repeated StoredFile files = 1; PaginationResponse pagination = 2; }
message SendNotificationRequest { RequestMetadata metadata = 1; Notification notification = 2; }
message SendBatchNotificationRequest { RequestMetadata metadata = 1; repeated Notification notifications = 2; }
message PauseTaskRequest {
  string task_id = 1;
  // D2 S2 换手入口（2026-09-29）：pause 即换手点——非空则在转 PAUSED 的同时换笔
  // （agent 快照更新；resume 后编排经 RunRequest.Agent 每次执行前动态读取生效）。
  // 有效值域=descriptor agent_providers 条目（validAgentID）。
  string agent = 2;
}
message ResumeTaskRequest { string task_id = 1; }
// SetTaskAgentRequest — 切换 Agent（TP20-T2）：PAUSED|QUEUED 态的任务换笔。
// RUNNING 态拒绝（走 PauseTask?agent= 回合边界换手）；语义校验延迟到运行期
// 装配（LoadDescriptor 兜底，与创建/pause 同链——web 只列真实条目后失败面已消大半）。
message SetTaskAgentRequest { string task_id = 1; string agent = 2; }
// PauseAnalysisRequest.agent_to — 切换目标（TP20-T2）：非空=冻结回调处向人性化流
// 写「── 切换 Agent from → to ──」marker（from=当前装配 agent 现成）；空=纯暂停零 marker。
message PauseAnalysisRequest {
  string task_id = 1;
  optional string agent_to = 2;
}
message ResumeAnalysisRequest { string task_id = 1; }
// ListAgents（TP20-T2 切换 Agent 收口）——descriptor 注册表如实投影。
message ListAgentsRequest {}
message ListAgentsResponse { repeated AgentProviderInfo agents = 1; }
// AgentProviderInfo — 一个可拉起的 agent 条目（capabilities 五布尔=agent_providers.yaml
// capabilities 如实声明，未声明=false 保守缺省——与 descriptor §3 同口径）。
message AgentProviderInfo {
  string id = 1;            // yaml 条目 id（"dsh"/"maka"/…）
  string dialect = 2;       // 方言名（能力差异的根源）
  bool is_default = 3;      // 首条=缺省
  bool tool_events = 4;
  bool structured_submit = 5;
  bool interaction = 6;
  bool session_resume = 7;
  bool conclude_semantics = 8;
}
message ListNotificationsRequest { string user_id = 1; bool unread_only = 2; PaginationRequest pagination = 3; }
message ListNotificationsResponse { repeated Notification notifications = 1; PaginationResponse pagination = 2; }
message MarkNotificationReadRequest { string notification_id = 1; }
