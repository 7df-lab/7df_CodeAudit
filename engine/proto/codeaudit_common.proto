// --- RuntimeService / CodeAnalysisService 骨架 ---
// AuthorizedTarget — 授权目标三元组（ADR-248 切片4后半，架构 §3 单一边界：
// 授权目标=任务【资源】字段，外层单向收紧）。host=主机名（policy DNS 应答合成
// 地址，直连真实 IP 恒拒=上游 SSRF 防线）；allowed_ips=代理可拨的真实 IP/CIDR
// 钉扎。protocol 不开放——组合器恒写 tcp（激活透明中继，§I8 契约）。
message AuthorizedTarget {
  string host = 1;
  uint32 port = 2;
  repeated string allowed_ips = 3;
}

// TaskOrigin — 任务归属元数据（R7/TP17-T4）：task-service → dsh-runtime →
// baton 投影档案（.tasklog envelope tenant/user 与 spine constraints 数据源）。
// 上游自任务实体填充（user=Task.created_by；constraints=config.ai_constraints
// 逗号分隔；tenant 单租户部署=空）。可选字段：缺省时投影档案不带这些维度。
// workspace（ADR-247 切片3后半）：网关 team 命名空间寻址值（来源=任务创建时
// 快照的 config.workspace，其源=Project.team 恒等映射）。**止步 dsh-runtime**
// （沙箱归属+inference 寻址），不下沉 baton 旗标（非归属元数据本体）。
message TaskOrigin {
  string tenant = 1;
  string user = 2;
  repeated string constraints = 3;
  string workspace = 4;  // ADR-247: 空串=回落 runtime.sandbox.workspace 全局缺省
  // ADR-248（切片4后半）：网络分型消费面——profile 源=pack spec.network.profile
  // 创建时快照（空=restricted 缺省档=沙箱不携带 spec.policy）；authorized_targets
  // 源=任务【资源】字段快照。**止步 dsh-runtime**（spec.policy 组合），不下沉 baton。
  string network_profile = 5;
  repeated AuthorizedTarget authorized_targets = 6;
}
// --- 图执行模式（平台切片 5+6，ADR-249；pack spec.execution=graph 的任务面） ---
// GraphConstraints — 图规模与重试封顶（pack spec.graph.constraints 创建时快照；
// 0 值=dsh-runtime 侧归一缺省：max_nodes=24/max_planner_replans=5/
// max_attempts_per_node=2——设计 §5）。超限拒绝声明+plan_triggered 留痕（D1，
// 不静默截断）。
message GraphConstraints {
  int32 max_nodes = 1;
  repeated string allowed_types = 2;  // ⊆ {planner,executor,verifier}；空=全集合
  int32 max_planner_replans = 3;
  int32 max_attempts_per_node = 4;
}
// GraphTimeouts — 类型化回合超时秒数（B3 三权；pack 可覆写；设计 §5）。
message GraphTimeouts {
  int32 planner_s = 1;    // 缺省 180
  int32 executor_s = 2;   // 缺省 900
  int32 verifier_s = 3;   // 缺省 300
}
// GraphSpec — 图执行配置（源=pack spec.graph，创建时快照贯穿）。
message GraphSpec {
  repeated string seed_intents = 1;  // 初始待办（可选：固定阶段/初始攻击面）
  GraphConstraints constraints = 2;
  GraphTimeouts timeouts = 3;
  int32 max_parallel = 4;            // v0.5 资源护栏（可选；0=动态派发无上限——人类裁决
                                     // 2026-09-22：并行度=计划结构自然输出，护栏仅显式声明生效）
}
message InjectGraphNodeMessageRequest {
  RequestMetadata metadata = 1;   // 幂等键（必须）
  string task_id = 2;
  string node_id = 3;
  string message = 4;             // 人消息全文（blob 化引用前的原文）
}
message InjectGraphNodeMessageResponse {
  bool accepted = 1;              // false=节点非运行态（回合边界排队语义下未受理）
  string node_status = 2;
  int32 event_seq = 3;            // graph.human_message 审计事件 seq
}
message ReopenGraphNodeRequest {
  RequestMetadata metadata = 1;
  string task_id = 2;
  string node_id = 3;
  string reason = 4;
}
message ReopenGraphNodeResponse {
  bool accepted = 1;              // 终态节点才可重开；任务非终态拒绝（诚实 400）
  string node_status = 2;
}
message ClaimGraphNodeRequest {
  RequestMetadata metadata = 1;
  string task_id = 2;
  string node_id = 3;
  int32 ttl_s = 4;                // 租约秒（0=缺省 1800）
}
message ClaimGraphNodeResponse {
  bool accepted = 1;              // declared 节点才可 human 认领
  string holder = 2;
  string lease_until = 3;         // RFC3339
}
message ReleaseGraphNodeRequest {
  RequestMetadata metadata = 1;
