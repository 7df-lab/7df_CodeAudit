  bool converged = 1;             // 图收敛（open 排空且 planner 无新态势）
  bool paused = 2;                // 冻结/换手挂起（graph.paused 已定格）
  int32 nodes_total = 3;          // 已声明节点数（含终态）
  int32 nodes_completed = 4;
  int32 nodes_failed = 5;
  int32 nodes_rejected = 6;
  int32 nodes_open = 7;           // declared-only open 计数（2026-09-20 人类裁决自 nodes_indeterminate 正名——原命名与语义错位）
  string graph_log_path = 8;      // <task>.graph.log 落盘路径（空=落盘未配置）
