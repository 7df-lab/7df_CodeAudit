}

// ------------------------------------------------------------
// StorageService（storage-service 部署）——V2.0 新增定义
// 兑现"补充 UploadFile/DownloadFile/GetPresignedUrl/GetFileInfo/
// DeleteFile/ListFiles"的整改声明
// ------------------------------------------------------------
service StorageService {
  rpc UploadFile(stream UploadFileChunk) returns (StoredFile);
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileChunk);
  rpc GetPresignedUrl(GetPresignedUrlRequest) returns (GetPresignedUrlResponse);  // 前端直传
  rpc GetFileInfo(GetFileInfoRequest) returns (StoredFile);
  rpc DeleteFile(DeleteFileRequest) returns (google.protobuf.Empty);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // 存储档位探测（ADR-225）：mode="s3"（MinIO 持久档）|"memory"（07 §10 降级档，重启即丢）。
  // 消费方=task-service 卷缓存 GC——memory 档绝不删除卷树（删=数据不可恢复）。
  rpc GetStorageMode(GetStorageModeRequest) returns (GetStorageModeResponse);
}

// ------------------------------------------------------------
// NotificationService（storage-service 部署）——V2.0 新增定义
// 消费 Kafka 事件（task.created/task.completed/task.stage.completed/
// finding.created/finding.verdict.updated）并投递通知
// ------------------------------------------------------------
service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (google.protobuf.Empty);
  rpc SendBatchNotification(SendBatchNotificationRequest) returns (google.protobuf.Empty);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (Notification);
}

// ============================================================
// 服务层请求/响应消息（骨架；具体字段随实现补充，结构以本文件为准）
// ============================================================

// --- TaskService ---
message CreateScanTaskRequest {
  RequestMetadata metadata = 1;   // 幂等键
  string project_id = 2;
  ScanMode scan_mode = 3;
  repeated string sast_tools = 4;
  Priority priority = 5;
  map<string, string> config = 6;
  string created_by = 7;          // ADR-199: 创建者（gateway 自 JWT 注入；事件通知收件人链）
  // ---- 增量扫描（ADR-225，D5 类型化契约，替代 config 字符串键方案）----
  bool incremental = 8;           // 增量意图；显式 baseline_task_id 无效时创建即 4xx（不静默替换）
  string baseline_task_id = 9;    // 显式基线；空=服务端按"同项目最近 COMPLETED 且源码可达"自动选定
  GitAnchor git_anchor = 10;      // 插件采集的版本锚点（非 git 工作区为空）
  string diff_hint = 11;          // 客户端 git diff --name-status 原文，仅交叉核对提示，不作 diff 依据
  // 任务【资源】字段（ADR-248 切片4后半）：授权目标三元组；创建时校验（拒载给
  // 字段路径）后快照进 ScanTask.authorized_targets。profile 不在此——权威=
  // pack spec.network.profile（负载定义唯一来源，防绕过 pack 语义）。
  repeated AuthorizedTarget authorized_targets = 12;
  // 任务级 Agent 选择（平台切片 7）：空=部署缺省（CODEAUDIT_AGENT/首条）；
  // 运行期 dsh-runtime LoadDescriptor 拒绝=AI 阶段诚实失败（创建期仅格式校验，
  // descriptor 域属 dsh-runtime——与 workspace/network_profile 快照贯穿同型）。
  string agent = 13;
}
message GetScanTaskRequest { string task_id = 1; }
message CancelScanTaskRequest { string task_id = 1; string reason = 2; }
message RetryScanTaskRequest {
  string task_id = 1;
  enum RetryScope { RETRY_ALL_FAILED = 0; RETRY_SPECIFIC = 1; RETRY_FROM_BEGINNING = 2; }
  RetryScope scope = 2;
  repeated string stage_ids = 3;
}
message ListScanTasksRequest {
  string project_id = 1;
  PaginationRequest pagination = 2;
  FilterRequest filter = 3;
  SortRequest sort = 4;
}
message ListScanTasksResponse {
  repeated ScanTask tasks = 1;
  PaginationResponse pagination = 2;
}
message StartTaskRequest { string task_id = 1; }
message CompleteTaskRequest { string task_id = 1; }
message FailTaskRequest { string task_id = 1; string error_message = 2; bool retryable = 3; }
message UpdateStageStatusRequest {
  string task_id = 1;
  string stage_id = 2;
  StageStatus status = 3;
  string error_message = 4;
}
message GetTaskProgressRequest { string task_id = 1; }
message WatchTaskProgressRequest { string task_id = 1; }
message ReportStageCompleteRequest {
  RequestMetadata metadata = 1;   // 幂等键
  string task_id = 2;
  string stage_id = 3;
  map<string, string> output_refs = 4;  // 阶段产出引用（如finding_ids、cpg路径）
}
message ReportStageFailedRequest {
  RequestMetadata metadata = 1;   // 幂等键
  string task_id = 2;
  string stage_id = 3;
  string error_message = 4;
}
message GetTaskContextRequest { string task_id = 1; }

// ---- 任务执行日志（ADR-167）----
enum TaskLogLevel {
  TASK_LOG_LEVEL_UNSPECIFIED = 0;
  TASK_LOG_LEVEL_INFO = 1;
  TASK_LOG_LEVEL_WARN = 2;
  TASK_LOG_LEVEL_ERROR = 3;
}
message TaskLogEntry {
  string log_id = 1;        // 服务端分配，任务内单调递增（GUI 增量游标）
  string task_id = 2;
  int64 ts_ms = 3;          // 服务端接收时刻（epoch 毫秒）
  TaskLogLevel level = 4;
  string source = 5;        // 产生方短名：sandbox / dsh-runtime / task / orchestrator
  string message = 6;
}
message AppendTaskLogRequest {
  RequestMetadata metadata = 1;   // 幂等键（R4）
  string task_id = 2;
  TaskLogLevel level = 3;
  string source = 4;
  string message = 5;
}
message AppendTaskLogResponse { TaskLogEntry entry = 1; }
message GetTaskLogsRequest {
  string task_id = 1;
  int32 limit = 2;            // 缺省服务端默认；0=默认
  string after_log_id = 3;    // 增量游标：只返回 log_id 严格大于它的条目
}
message GetTaskLogsResponse { repeated TaskLogEntry logs = 1; }

// ---- ADR-189 任务快照订阅流（GUI WebSocket 上游真推送）----
message StreamTaskSnapshotRequest {
  string task_id = 1;
  string logs_after = 2;      // 日志游标：只推 log_id 严格大于它的条目；空=从头
}
message TaskSnapshotDelta {
  ScanTask task = 1;                 // 最近全量任务态（含阶段）
  TaskProgress progress = 2;         // 派生进度（随 task 一并重算下发）
  GetTaskLogsResponse logs = 3;      // 订阅位之后的日志增量
  bool settled = 4;                  // 任务已终态：本帧后服务端关流
}

// ---- 计量查询（ADR-247 切片3后半：baton usage.recorded 终态归集投影）----
// task_usage 表按 task 聚合；总计+分模型明细。tenant/user 打标来自 .tasklog
// envelope（TaskOrigin 贯通成果）。total_tokens **聚合一律自算**=input+cache_read+
// cache_write+output（reasoning 已含于 output 不重复计入）；表列 total_tokens 保留
// 上游原始观测（D2 忠实存档），API 面不透传上游值（口径确定，无歧义）。
message GetTaskUsageRequest { string task_id = 1; }
message TaskModelUsage {
  string model = 1;
  int32 calls = 2;                // usage.recorded 事件数（≈回合内模型调用数）
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 cache_read_tokens = 5;
  int64 cache_write_tokens = 6;
  int64 reasoning_tokens = 7;
  int64 total_tokens = 8;         // 计费输入口径（input+cache_read+cache_write）+output
}
message TaskUsageSummary {
  string task_id = 1;
  string tenant = 2;              // envelope 打标（origin 未填=空，不虚构）
  string user = 3;
  repeated TaskModelUsage models = 4;   // 分模型明细（按 model 分组）
  TaskModelUsage totals = 5;            // 全模型合计（model 为空）
}

// ------------------------------------------------------------
// 图执行视图（切片5+6 暴露批，2026-09-20；设计=伞仓 docs/designs/platform-graph-web-exposure.md §1）
// ------------------------------------------------------------
message GetTaskGraphRequest { string task_id = 1; }

message TaskGraphNode {
  string id = 1;
  string type = 2;           // planner | executor | verifier
  string intent = 3;
  string declared_by = 4;
  repeated string from = 5;  // 依赖（渲染为行首 chip，非连线）
  string status = 6;         // declared | running | completed | failed | rejected | indeterminate
  int32 attempts = 7;
  string started_at = 8;     // RFC3339（事件 time 字段）
  string ended_at = 9;
  string result_ref = 10;    // 终态一句话摘要（域中立）
  int32 declared_seq = 11;   // 声明事件 seq——计划批次归属键（v1：web 按此切分批次带）
  string holder = 12;        // v0.5 认领层：当前持有者（engine-worker|human；空=未认领）
  string lease_until = 13;   // v0.5：human claim 的租约截止（RFC3339；空=无租约）
}

message TaskGraphPlanTrigger {
  string trigger = 1;        // initial | new_evidence | open_drained
  string detail = 2;
  string at = 3;             // RFC3339
  int32 seq = 4;             // 事件序（计划批次带渲染序）
}

message TaskGraph {
  string task_id = 1;
  repeated TaskGraphNode nodes = 2;                 // 声明序=seq 因果序
  repeated TaskGraphPlanTrigger plan_triggers = 3;  // 计划批次史（签名元素数据源）
  bool paused = 4;
  string pause_reason = 5;
  bool converged = 6;
  string converge_summary = 7;
  int32 open_remaining = 8;
  string updated_at = 9;     // 最后事件时刻
  repeated string open_node_ids = 10; // declared-only open 节点集（§1.1 paused 契约：挂起横幅"未决节点 n"）
}

// ------------------------------------------------------------
// 编排（负载 pack）生命周期（编排 CRUD 批 2026-09-21；修订语义=append-only，
// 依据=platform-slice2-pack-schema §3 + ADR-245）
// ------------------------------------------------------------
message ListOrchestrationsRequest {
  bool include_deprecated = 1;
  bool include_history = 2;      // true=每编排带完整修订史（默认只带最新）
}

message OrchestrationRevision {
  int32 revision = 1;
  string spec_hash = 2;
  string created_by = 3;
  string created_at = 4;         // RFC3339
}

message OrchestrationInfo {
  string name = 1;
  int32 latest_revision = 2;
  string spec_yaml = 3;          // 规范化 YAML（apiVersion/kind/name/description/spec 全量）
  string spec_hash = 4;
  string execution = 5;          // session | graph
  string description = 6;
  bool deprecated = 7;
  bool readonly = 8;             // 内置编排（configs/packs 装载）——不可改/停
  repeated OrchestrationRevision history = 9;
  string updated_at = 10;        // 最新修订时刻
}

message CreateOrchestrationRequest {
  string name = 1;               // DNS-1123；与 spec_yaml.name 一致（服务端校验）
  string spec_yaml = 2;          // 全量 pack YAML（服务端 Validate）
}

message ListOrchestrationsResponse {
  repeated OrchestrationInfo orchestrations = 1;
}

message UpdateOrchestrationRequest {
  string name = 1;               // append 新修订（内置只读拒改）
  string spec_yaml = 2;
}

message DeprecateOrchestrationRequest {
  string name = 1;
  bool unde_precate = 2;         // true=恢复
}

// GitAnchor — 版本锚点（ADR-225 D5：插件经 vscode.git 采集；任务持有"当时"快照，
// 供审计"扫的是哪个版本"与扫前无变更预检；不参与基线解析）
message GitAnchor {
  string commit = 1;   // HEAD 全长 hash；非 git 工作区为空
  string branch = 2;
  bool dirty = 3;      // 扫描时刻工作区有未提交改动
  string remote = 4;   // origin URL，项目↔仓库关联参考
}

message ScanTask {
  string task_id = 1;
  string project_id = 2;
  ScanMode scan_mode = 3;
  repeated string sast_tools = 4;
  TaskStatus status = 5;
  Priority priority = 6;
  repeated TaskStage stages = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string created_by = 10;
  string error_message = 11;
  int32 retry_count = 12;         // 自动重试次数（≤2）
  // ADR-203 补遗: 源码指针快照（人类审核意见①）——启动时从项目 config 解析到的
  // upload_file_id 回写任务自身；项目持有"当前"指针，任务持有"当时"快照，
  // 项目重传/任务重试不漂移，报告可回答"扫的是哪份包"
  map<string, string> config = 13;
  // ---- 增量扫描快照（ADR-225；Prepare 解析后回写任务自身，重试不重算）----
  string baseline_task_id = 14;        // 增量基线；空=全量任务（含增量降级为全量）
  repeated string changed_files = 15;  // 新增∪修改，相对剥壳后项目根（口径与 findings.file_path 对齐）
  repeated string deleted_files = 16;  // 相对剥壳后项目根
  GitAnchor git_anchor = 17;           // 扫描时刻版本锚点快照
  string diff_source = 18;             // diff 机制审计：content（V1）| git（repo 型演进预留）
  // 任务【资源】字段快照（ADR-248 切片4后半）：授权目标三元组（创建时校验后
  // 快照，重试/项目变更不漂移；dsh-runtime 组合 targeted spec.policy 消费）
  repeated AuthorizedTarget authorized_targets = 19;
  // Agent 选择快照（切片 7）：创建时快照（重试不漂移）；空=部署缺省
  string agent = 20;
}
message TaskProgress {
  string task_id = 1;
  TaskStatus status = 2;
  float overall_percent = 3;
  repeated TaskStage stages = 4;
}
message TaskProgressEvent {
  string task_id = 1;
  TaskStatus status = 2;
  string stage_id = 3;
  string message = 4;
  google.protobuf.Timestamp timestamp = 5;
}
message TaskContext {
  string task_id = 1;
  string project_config_json = 2;
  string cpg_storage_path = 3;
  repeated string sast_finding_ids = 4;
  repeated string ai_finding_ids = 5;
}

// --- ProjectService / UserService 骨架 ---
// team（ADR-247 切片3后半）：项目归属团队声明——workspace=team 命名空间的
// 来源（架构 §5 层级 team/project/task/session）。空=未归属（任务回落全局
// 缺省 workspace）；team 名即网关 workspace 名（恒等映射，ADR-247）。
message Project { string project_id = 1; string name = 2; string repo_url = 3; string default_branch = 4; ScanMode default_scan_mode = 5; google.protobuf.Timestamp created_at = 6; string team = 7; }
message CreateProjectRequest { RequestMetadata metadata = 1; Project project = 2; }
message GetProjectRequest { string project_id = 1; }
message UpdateProjectRequest { Project project = 1; }
message DeleteProjectRequest { string project_id = 1; }
message ListProjectsRequest { PaginationRequest pagination = 1; FilterRequest filter = 2; SortRequest sort = 3; }  // sort/filter 2026-10-04 ADR-256 落地（此前 filter 预留无实现）
message ListProjectsResponse { repeated Project projects = 1; PaginationResponse pagination = 2; }
message ProjectConfig { string project_id = 1; map<string, string> config = 2; }
message GetProjectConfigRequest { string project_id = 1; }
message UpdateProjectConfigRequest { ProjectConfig config = 1; }
message ProjectStats { string project_id = 1; int32 total_tasks = 2; int32 total_findings = 3; float avg_f1 = 4; }
message GetProjectStatsRequest { string project_id = 1; }
message ProjectMember { string project_id = 1; string user_id = 2; string role = 3; }
message AddProjectMemberRequest { RequestMetadata metadata = 1; ProjectMember member = 2; }
message RemoveProjectMemberRequest { string project_id = 1; string user_id = 2; }
message ListProjectMembersRequest { string project_id = 1; PaginationRequest pagination = 2; }
message ListProjectMembersResponse { repeated ProjectMember members = 1; PaginationResponse pagination = 2; }

// V2.1 (ADR-205): 全局角色（对齐 project-service rolePermissions：admin/developer/viewer）
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ADMIN = 1;
  ROLE_DEVELOPER = 2;
  ROLE_VIEWER = 3;
}
message User { string user_id = 1; string username = 2; string email = 3; enum UserState { USER_STATE_UNSPECIFIED = 0; USER_STATE_ACTIVE = 1; USER_STATE_INACTIVE = 2; USER_STATE_LOCKED = 3; } UserState state = 4; google.protobuf.Timestamp created_at = 5; Role role = 6;  // V2.1 (ADR-205)
  bool must_change_password = 7;  // V2.1 (ADR-205)：首登/重置后强制改密标记，ChangePassword 成功即清除
}
message LoginRequest { string username = 1; string password = 2; }
message LoginResponse { string access_token = 1; string refresh_token = 2; int64 expires_in_s = 3; }
message LogoutRequest { string access_token = 1; }
message RefreshTokenRequest { string refresh_token = 1; }
message RefreshTokenResponse { string access_token = 1; string refresh_token = 2; int64 expires_in_s = 3; }
message GetCurrentUserRequest { string access_token = 1; }
message GetUserRequest { string user_id = 1; }
message UpdateUserRequest { User user = 1; }
message ValidatePermissionRequest { string user_id = 1; string resource_type = 2; string resource_id = 3; string action = 4; }
message ValidatePermissionResponse { bool allowed = 1; string reason = 2; }
message GetUserPermissionsRequest { string user_id = 1; }
message UserPermissions { string user_id = 1; repeated string permissions = 2; }

// --- V2.1 用户生命周期 (ADR-205) ---
message RegisterUserRequest { RequestMetadata metadata = 1; string username = 2; string email = 3; string password = 4; string invite_code = 5; }  // 自助注册：邀请码制默认（configs auth.registration_mode = invitation|open|disabled）
message ListUsersRequest { PaginationRequest pagination = 1; User.UserState state = 2; string username_contains = 3; }
message ListUsersResponse { repeated User users = 1; PaginationResponse pagination = 2; }
message CreateUserRequest { RequestMetadata metadata = 1; string username = 2; string email = 3; string password = 4; Role role = 5; }  // 管理员直建：密码经网关侧生成的一次性临时密码由管理员转交
message ChangePasswordRequest { RequestMetadata metadata = 1; string user_id = 2; string old_password = 3; string new_password = 4; }
message ResetPasswordRequest { RequestMetadata metadata = 1; string user_id = 2; }
message ResetPasswordResponse { string temporary_password = 1; bool must_change_password = 2; }

// --- V2.2 邀请码管理 (ADR-255) ---
// state 只存 active|revoked（防漂移）；「已用尽/已过期」为派生态：
// terminal = state=revoked OR (max_uses>0 AND used_count>=max_uses) OR (expires_at 非 nil AND 已过)。
message InviteCode {
  string id = 1;
  string code = 2;                      // CODEAUDIT-XXXXX-XXXXX（Crockford Base32 去 I/L/O/U，系统生成）
  int32 max_uses = 3;                   // 使用上限：0=不限（仅靠吊销下线）；缺省 1=一次性
  int32 used_count = 4;
  google.protobuf.Timestamp expires_at = 5;  // 空=永不过期；缺省 30 天（07 §7.1）
  string state = 6;                     // active | revoked
  string note = 7;                      // 管理员备注（如"给张三入职用"）；码本身系统生成不可自定义
  string created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp revoked_at = 10; // 吊销时间（state=revoked 时非空）
  string last_used_by = 11;             // 最近一次消费归属（完整流水为 V3，不虚记）
  google.protobuf.Timestamp last_used_at = 12;
  Role role = 13;                       // 注册落地角色（ADR-257）：仅 DEVELOPER|VIEWER 会落值；
                                        // UNSPECIFIED=按 DEVELOPER（旧码/静态配置码兼容）
}
message CreateInviteCodeRequest {
  RequestMetadata metadata = 1;
  optional int32 max_uses = 2;                  // 未设=缺省 1（一次性，07 §7.1）；0=不限（仅靠吊销下线）；负值 INVALID_ARGUMENT
  google.protobuf.Timestamp expires_at = 3;     // 未设且 never_expires=false=缺省 now+30 天（07 §7.1）
  bool never_expires = 4;                       // 显式永不过期；与 expires_at 同设=INVALID_ARGUMENT
  string note = 5;                              // 管理员备注（码本体系统生成不可自定义）
  string created_by = 6;                        // 创建者归属：网关从 JWT sub 注入（直连 gRPC 管理端可自填；空=服务端记 "admin"）
  Role role = 7;                                // 注册后角色（ADR-257）：仅 DEVELOPER|VIEWER；
                                               // UNSPECIFIED=DEVELOPER；ADMIN 禁发（admin 经控制台直建，INVALID_ARGUMENT）
}
message ListInviteCodesRequest { PaginationRequest pagination = 1; bool include_terminal = 2; }  // 缺省仅有效码
message ListInviteCodesResponse {
  repeated InviteCode codes = 1;
  PaginationResponse pagination = 2;
  repeated string config_codes = 3;  // 配置静态注入码（bootstrap 层，只读；无 id/无管理操作位）
}
message RevokeInviteCodeRequest { RequestMetadata metadata = 1; string id = 2; }
message DeleteInviteCodeRequest { RequestMetadata metadata = 1; string id = 2; }
message GetRegistrationPolicyRequest {}
message GetRegistrationPolicyResponse { string mode = 1; }  // invitation | open | disabled（仅枚举值，无码表无计数）

// --- ResultService / ReportService 骨架 ---
message AuditFinding { UnifiedFinding finding = 1; }
message CreateFindingRequest { RequestMetadata metadata = 1; UnifiedFinding finding = 2; }
message GetFindingRequest { string finding_id = 1; }
message UpdateFindingRequest { UnifiedFinding finding = 1; }
message DeleteFindingRequest { string finding_id = 1; }
message ListFindingsRequest { string task_id = 1; PaginationRequest pagination = 2; FilterRequest filter = 3; SortRequest sort = 4; }
message ListFindingsResponse { repeated UnifiedFinding findings = 1; PaginationResponse pagination = 2; }
message BatchCreateFindingsRequest {
  RequestMetadata metadata = 1;   // 幂等键
  repeated UnifiedFinding findings = 2;
}
message BatchCreateFindingsResponse { repeated string finding_ids = 1; int32 failed_count = 2; }
message BatchUpdateFindingsRequest {
  RequestMetadata metadata = 1;   // 幂等键
  repeated string finding_ids = 2;
  map<string, string> patch_json = 3;
}
message BatchUpdateFindingsResponse { int32 updated_count = 1; repeated string failed_ids = 2; }
message BatchUpdateVerdictRequest {
  RequestMetadata metadata = 1;
  repeated string finding_ids = 2;
  VerdictDirection direction = 3; // 档位服务端钉 DEFINITE（该口存在的两类写者：人工 triage/沙箱验证回写，皆结构化裁决）
  float confidence = 4;
}
message BatchUpdateVerdictResponse { int32 updated_count = 1; }
message UpdateVerdictRequest { string finding_id = 1; VerdictDirection direction = 2; float confidence = 3; string reasoning = 4; }
