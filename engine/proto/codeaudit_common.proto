// --- AI 交互日志（ADR-168；补遗②人性化渲染）---
// 沙箱内 DSH 经 bridge（JSON-RPC⇄SSE）的交互流：任务运行中增量可读（GUI 实时回显），
// 任务终态后即最终交互日志。chunk 为按 event type 人性化渲染的 utf-8 文本（中文行 +
// 模型原话流式正文，ADR-168 补遗②——原始帧不面向用户，仅由 dsh-runtime 落盘
// data/ai-interaction/<taskID>.sse.log 供机器调试）。游标为该人性化流的字节偏移。
message GetAIInteractionLogRequest {
  string task_id = 1;
  int64 cursor = 2;         // 字节游标：返回严格大于该偏移的内容；0=从头
  int32 max_bytes = 3;      // 单次返回上限（字节）；0=服务端默认
  // graph-ui-channels 批2（2026-09-23）：图任务逐节点通道游标（节点缺省=0 从头；
  // 非图任务恒空——字段对既有调用方零影响）。
  map<string, int64> node_cursors = 4;
}

// AILogGranularity — AI 交互日志的到达粒度（b4，platform-acp-bridge-v1 §4）：
// 契约级声明面——前端按通道/主面元数据渲染粒度文案（"逐字实时"vs"整回合到达"），
// 替代 agent 名判别过渡案。真源=方言（协议固有属性，非部署配置）：dsh-sse 逐字
// chunk=TOKEN；acp-stdio 管道/maka runtime-host 回合到达=TURN。
enum AILogGranularity {
  AI_LOG_GRANULARITY_UNSPECIFIED = 0; // 未声明（盘回落档/旧后端——前端回落过渡案）
  AI_LOG_GRANULARITY_TURN = 1;        // 整回合到达（回合收束才见正文）
  AI_LOG_GRANULARITY_TOKEN = 2;       // 逐字实时（流式 chunk）
}

// AILogChannel — 图任务单节点 AI 交互通道增量（graph-ui-channels 批2）：键=nodeID，
// 游标/截断/收束语义与主面同构（通道内容=该节点会话的完整人性化时间线——
// g-<nodeID> 会话经 channelRenderer 双轨渲染，主 flat 流不变）。
message AILogChannel {
  string node_id = 1;
  bytes chunk = 2;          // 该节点通道增量（人性化文本）
  int64 next_cursor = 3;    // 下一次请求该节点携带的游标
  bool complete = 4;        // 与主面共享任务收束位
  int64 total_bytes = 5;    // 该节点通道当前总字节数
  // b4：该通道的到达粒度（同任务各通道同值——条目创建时按方言定格）。
  AILogGranularity granularity = 6;
}
message GetAIInteractionLogResponse {
  bytes chunk = 1;          // 人性化渲染文本（utf-8；按 event type 中文行+流式正文）
  int64 next_cursor = 2;    // 下一次请求携带的游标
  bool complete = 3;        // 分析已终态：日志不再增长（最终日志已可整体获取）
  int64 total_bytes = 4;    // 当前日志总字节数
  // graph-ui-channels 批2：图任务逐节点通道增量（非图任务为空数组）。
  repeated AILogChannel channels = 5;
  // b4：主面到达粒度（与通道同源——同一条目同方言）。
  AILogGranularity granularity = 6;
}

// ---- ADR-189 交互日志订阅流 ----
message StreamAIInteractionLogRequest {
  string task_id = 1;
  int64 cursor = 2;         // 字节游标：语义同 GetAIInteractionLog.cursor
  int32 max_bytes = 3;      // 单帧上限（字节）；0=服务端默认
  // graph-ui-channels 批2：逐节点通道游标（重连续订位；节点缺省=0）。
  map<string, int64> node_cursors = 4;
}

