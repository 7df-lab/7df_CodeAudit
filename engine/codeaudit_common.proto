// --- AI 交互日志（ADR-168；补遗②人性化渲染）---
// 沙箱内 DSH 经 bridge（JSON-RPC⇄SSE）的交互流：任务运行中增量可读（GUI 实时回显），
// 任务终态后即最终交互日志。chunk 为按 event type 人性化渲染的 utf-8 文本（中文行 +
// 模型原话流式正文，ADR-168 补遗②——原始帧不面向用户，仅由 dsh-runtime 落盘
// data/ai-interaction/<taskID>.sse.log 供机器调试）。游标为该人性化流的字节偏移。
message GetAIInteractionLogRequest {
  string task_id = 1;
  int64 cursor = 2;         // 字节游标：返回严格大于该偏移的内容；0=从头
  int32 max_bytes = 3;      // 单次返回上限（字节）；0=服务端默认
}
message GetAIInteractionLogResponse {
  bytes chunk = 1;          // 人性化渲染文本（utf-8；按 event type 中文行+流式正文）
  int64 next_cursor = 2;    // 下一次请求携带的游标
  bool complete = 3;        // 分析已终态：日志不再增长（最终日志已可整体获取）
  int64 total_bytes = 4;    // 当前日志总字节数
}

// ---- ADR-189 交互日志订阅流 ----
message StreamAIInteractionLogRequest {
  string task_id = 1;
  int64 cursor = 2;         // 字节游标：语义同 GetAIInteractionLog.cursor
  int32 max_bytes = 3;      // 单帧上限（字节）；0=服务端默认
}

