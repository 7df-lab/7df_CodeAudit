// ------------------------------------------------------------
// DSHRuntimeService（dsh-runtime-service 部署）——Agent编排
// 定版 12 RPC（V1.x 工作流文档的 3 RPC 版作废；ADR-168 += GetAIInteractionLog）
// RunAIAnalysis / ReviewSASTResults 必须携带幂等键（R6）
// ------------------------------------------------------------
service DSHRuntimeService {
  // 分析主接口（模式A/B/C）
  rpc RunAIAnalysis(RunAIAnalysisRequest) returns (RunAIAnalysisResponse);                  // 模式B/C
  rpc VerifySASTResults(VerifySASTResultsRequest) returns (VerifySASTResultsResponse);  // 模式D AI增强SAST 阶段3（ADR-186 复用原4a；含同段去重）
  rpc SearchMissedVulns(SearchMissedVulnsRequest) returns (SearchMissedVulnsResponse);  // 【已弃用 ADR-182】原4b，仅历史模式兼容
  rpc ReviewSASTResults(ReviewSASTResultsRequest) returns (ReviewSASTResultsResponse);  // 【已弃用 ADR-182】旧模式D，仅历史模式兼容

  // 进度与会话
  rpc GetAnalysisProgress(GetAnalysisProgressRequest) returns (AnalysisProgress);
  rpc WatchAnalysisProgress(WatchAnalysisProgressRequest) returns (stream AnalysisProgressEvent);
  rpc GetSessionStatus(GetSessionStatusRequest) returns (SessionStatus);
  rpc CancelAnalysis(CancelAnalysisRequest) returns (google.protobuf.Empty);
  rpc PauseAnalysis(PauseAnalysisRequest) returns (google.protobuf.Empty);   // ADR-200: 会话回合闸门挂起（当前回合跑完生效）
  rpc ResumeAnalysis(ResumeAnalysisRequest) returns (google.protobuf.Empty); // ADR-200: 释放闸门继续后续回合
  // AI 交互日志（ADR-168）：沙箱内 DSH bridge SSE 交互的原始留存，游标增量读取
  rpc GetAIInteractionLog(GetAIInteractionLogRequest) returns (GetAIInteractionLogResponse);
  // ADR-189 交互日志订阅流：人性化流写入即推增量（字节游标语义与 GetAIInteractionLog
  // 一致；complete=true 终帧后服务端关流）
  rpc StreamAIInteractionLog(StreamAIInteractionLogRequest) returns (stream GetAIInteractionLogResponse);
}

