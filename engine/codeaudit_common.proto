  rpc DeleteFinding(DeleteFindingRequest) returns (google.protobuf.Empty);
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);
  rpc BatchCreateFindings(BatchCreateFindingsRequest) returns (BatchCreateFindingsResponse);  // 幂等
  rpc BatchUpdateFindings(BatchUpdateFindingsRequest) returns (BatchUpdateFindingsResponse);  // 幂等
  rpc BatchUpdateVerdict(BatchUpdateVerdictRequest) returns (BatchUpdateVerdictResponse);
  rpc UpdateVerdict(UpdateVerdictRequest) returns (AuditFinding);
  rpc GetFindingsByVerdict(GetFindingsByVerdictRequest) returns (ListFindingsResponse);
  rpc GetTaskResultStats(GetTaskResultStatsRequest) returns (ResultStats);
  rpc ExportFindings(ExportFindingsRequest) returns (ExportFindingsResponse);

  // 误报反馈闭环（评审整合项）
  rpc SubmitFindingFeedback(SubmitFindingFeedbackRequest) returns (SubmitFindingFeedbackResponse);
}

